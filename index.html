<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA VI Screensaver</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
img{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 2.5s ease}
img.on{opacity:1}.msg{position:fixed;inset:0;display:grid;place-items:center;color:#aaa;font:16px -apple-system,sans-serif;text-align:center;padding:2rem}
.countdown{position:fixed;z-index:5;right:3%;bottom:3%;padding:.28em .6em;border-radius:.35em;background:transparent;color:rgba(255,255,255,.27);font:600 clamp(9px,1.125vw,20px)/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.03em;text-shadow:none;white-space:nowrap}
</style></head><body><div class="msg" id="msg">Loading official GTA VI media…</div><img id="a"><img id="b"><div class="countdown" id="countdown" aria-label="GTA VI release countdown"></div>
<script>
const INTERVAL=30000, RELEASE=Date.UTC(2026,10,19);let imgs=[],i=0,front=a,back=b;
function updateCountdown(){const now=Date.now(),days=Math.max(0,Math.ceil((RELEASE-now)/86400000));countdown.textContent=days===1?"1 DAY":days+" DAYS"}
updateCountdown();setInterval(updateCountdown,3600000);
function shuffle(x){for(let n=x.length-1;n;n--){const j=Math.floor(Math.random()*(n+1));[x[n],x[j]]=[x[j],x[n]]}return x}
function next(){if(!imgs.length)return;if(i>=imgs.length){shuffle(imgs);i=0}back.onload=()=>{msg.style.display="none";back.classList.add("on");front.classList.remove("on");setTimeout(()=>[front,back]=[back,front],2600)};back.src=imgs[i++].url}
fetch("images.json?"+Date.now()).then(r=>r.json()).then(x=>{imgs=shuffle(x.filter(v=>v.url));next();setInterval(next,INTERVAL)}).catch(()=>msg.textContent="Image list is updating. Please try again shortly.");
</script></body></html>
